name: Mobile artifacts

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public API base URL embedded in both apps
        required: true
        default: https://d2dgmlbp00gdhh.cloudfront.net
        type: string
  workflow_call:
    inputs:
      api_url:
        description: Public API base URL embedded in both apps
        required: true
        type: string
    secrets:
      GOOGLE_MAPS_API_KEY:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      MOBILE_API_URL: ${{ inputs.api_url }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure stable Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/kubix-release.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/kubix-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          set -euo pipefail
          test -n "$MOBILE_API_URL"
          test -n "$GOOGLE_MAPS_API_KEY"
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=API_URL="$MOBILE_API_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}"
      - uses: actions/upload-artifact@v4
        with:
          name: kubix-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator app
    runs-on: macos-15
    env:
      MOBILE_API_URL: ${{ inputs.api_url }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure iOS Maps key
        run: printf 'MAPS_API_KEY=%s\n' "${GOOGLE_MAPS_API_KEY:-}" > ios/Flutter/MapsSecrets.xcconfig
      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          test -n "$MOBILE_API_URL"
          test -n "$GOOGLE_MAPS_API_KEY"
          flutter build ios --simulator \
            --dart-define=API_URL="$MOBILE_API_URL" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ios/iphonesimulator/Kubix-UTN-2.0-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kubix-ios-simulator-app
          path: mobile/build/ios/iphonesimulator/Kubix-UTN-2.0-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
