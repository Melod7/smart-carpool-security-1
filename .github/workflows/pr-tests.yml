name: pr-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (KBX-27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test + coverage
        run: make test-be
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: qa/results/backend-coverage/
          if-no-files-found: warn

  web:
    name: Web (KBX-27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install + coverage
        run: |
          cd web && npm ci
          cd .. && make test-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: qa/results/web-coverage/
          if-no-files-found: warn

  mobile:
    name: Mobile (KBX-27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test + coverage
        run: |
          cd mobile && flutter pub get
          cd .. && make test-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: qa/results/mobile-coverage/
          if-no-files-found: warn
