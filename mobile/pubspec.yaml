name: kubix_mobile
description: Kubix UTN 2.0 — Smart Carpool Security, app mobile (conductores y pasajeros)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  go_router: ^14.6.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/kubix-utn-2.0-icon.png
