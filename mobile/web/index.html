<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si sirves la app web en una ruta distinta de la raíz, cambia el valor de
    href abajo para reflejar la ruta base desde la que se sirve.

    La ruta indicada abajo debe empezar y terminar con una barra "/" para que
    funcione correctamente.

    Más detalles:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    Este es un placeholder del base href que será reemplazado por el valor del
    argumento `--base-href` proporcionado a `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kubix UTN — Smart Carpool Security (móvil)">

  <!-- Meta tags e iconos iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kubix UTN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kubix UTN</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Puedes personalizar el script "flutter_bootstrap.js".
    Es útil para dar una configuración personalizada al loader de Flutter
    o para dar feedback al usuario durante la inicialización.

    Más detalles:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
